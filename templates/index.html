<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus AI - Web Assistant</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f1a;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #1a1a2e;
      padding: 16px 24px;
      border-bottom: 1px solid #2a2a4a;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 {
      font-size: 20px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    header span { color: #8888aa; font-size: 13px; }
    .badge {
      background: #2a2a4a;
      padding: 2px 10px;
      border-radius: 10px;
      font-size: 11px;
      color: #aabbff;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.5;
      font-size: 14px;
      word-wrap: break-word;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .user {
      align-self: flex-end;
      background: #2b2b52;
      border-bottom-right-radius: 4px;
    }
    .bot {
      align-self: flex-start;
      background: #1e1e36;
      border-bottom-left-radius: 4px;
    }
    .bot a {
      color: #667eea;
      text-decoration: none;
      font-weight: 500;
    }
    .bot a:hover { text-decoration: underline; }
    .typing {
      align-self: flex-start;
      background: #1e1e36;
      padding: 14px 20px;
      border-radius: 12px;
      border-bottom-left-radius: 4px;
      display: flex;
      gap: 5px;
    }
    .typing span {
      width: 8px; height: 8px;
      background: #667eea;
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }
    #input-area {
      padding: 16px 24px;
      background: #1a1a2e;
      border-top: 1px solid #2a2a4a;
      display: flex;
      gap: 10px;
    }
    #input-area input {
      flex: 1;
      background: #12122a;
      border: 1px solid #2a2a4a;
      color: #e0e0e0;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    #input-area input:focus { border-color: #667eea; }
    #input-area button {
      background: #667eea;
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }
    #input-area button:hover { background: #5a6fd6; }
    #input-area button:disabled {
      background: #3a3a5a;
      cursor: not-allowed;
    }
    .examples {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 8px 24px 0;
    }
    .examples button {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      color: #8899cc;
      padding: 4px 12px;
      border-radius: 14px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .examples button:hover {
      border-color: #667eea;
      color: #aabbff;
    }
  </style>
</head>
<body>
<header>
  <h1>Nexus AI</h1>
  <span>Web Assistant</span>
  <span class="badge">Online</span>
</header>
<div class="examples">
  <button onclick="sendExample('search for python tutorials')">Search web</button>
  <button onclick="sendExample('play music on youtube')">YouTube</button>
  <button onclick="sendExample('save this text')">Save text</button>
  <button onclick="sendExample('find my notes')">Find file</button>
</div>
<div id="chat">
  <div class="msg bot">
    Hello! I'm Nexus AI, your web assistant. Type a command or try one of the examples above.
  </div>
</div>
<div id="input-area">
  <input type="text" id="input" placeholder="Type a message..." autofocus>
  <button id="send-btn" onclick="sendMessage()">Send</button>
</div>
<script>
  const chat = document.getElementById('chat');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send-btn');

  input.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

  function addMessage(text, role, url) {
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    if (url) {
      div.innerHTML = `${text} <a href="${url}" target="_blank">Open link</a>`;
    } else {
      div.textContent = text;
    }
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'typing';
    div.id = 'typing-indicator';
    div.innerHTML = '<span></span><span></span><span></span>';
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function hideTyping() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  function setLoading(loading) {
    input.disabled = loading;
    sendBtn.disabled = loading;
    if (loading) input.blur();
    else input.focus();
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    addMessage(text, 'user');
    setLoading(true);
    showTyping();

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });
      const data = await res.json();
      hideTyping();
      if (data.action === 'goodbye') {
        addMessage(data.response, 'bot');
        setLoading(true);
        return;
      }
      addMessage(data.response, 'bot', data.url || null);
    } catch (err) {
      hideTyping();
      addMessage('Sorry, something went wrong. Is the server running?', 'bot');
    }
    setLoading(false);
  }

  function sendExample(text) {
    input.value = text;
    sendMessage();
  }
</script>
</body>
</html>
